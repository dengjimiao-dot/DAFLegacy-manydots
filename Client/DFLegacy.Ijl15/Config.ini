; IJL15 settings for the 2008DF client.
; The client renderer stays at 640x480. Width and Height only stretch the
; outer game window, so keep a 4:3 ratio for the original UI layout.

[Resolution]
Width=640
Height=480

[Rendering]
; D3D8-compatible texture sampling: point, linear, anisotropic, or native.
ScaleFilter=native

[Features]
; 1/on/true enables the IJL15 FPS and committed-memory overlay.
EnablePerformanceOverlay=1
; 1/on/true installs the IJL15 mouse-wheel scroll hook.
EnableMouseWheel=1
