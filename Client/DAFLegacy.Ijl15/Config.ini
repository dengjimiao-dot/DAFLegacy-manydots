; IJL15 客户端配置。
; 开关取 1/on/true 为开启，0/off/false 为关闭；缺失的键使用默认值。

[Resolution]
Width=640
Height=480

[Rendering]
; 纹理采样：point、linear、anisotropic 或 native。
ScaleFilter=native

[Features]
; 显示 FPS 与内存占用悬浮层。
EnablePerformanceOverlay=1
; 安装鼠标滚轮滚动钩子。
EnableMouseWheel=1
; 禁用客户端反调试探测。
DisableDebuggerDetection=1
; 允许同目录多开游戏窗口。
AllowMultipleClientInstances=1
; 启动时不最小化窗口。
DisableStartupMinimize=1
; 装扮期数按钮合并为一个常驻选项。
SinglePermanentAvatarPeriodOption=1
; 名单中列出的 [etc] 堆叠道具走自定义使用路径（47 号命令）。
EnableCustomStackableUseMode1=1
; 自定义弹窗公告去掉标题行。
RemoveCustomPopupAnnouncementTitle=1
; 字符串表改用 Plugin\dnf.str 外部文件。
UseExternalDnfStringTable=1
; 首封邮件到达时保持邮件归档页签刷新。
FixMailboxArchiveRefresh=1
; 点券商城购买门控补丁总开关。
BypassCeraPurchaseRestrictions=1
; 保持 DNF.trc / NeopleEngine.LOG 日志为明文。
ForcePlainTextLogs=1
; 屏蔽 type-16 消息的提示音。
DisableType16ChatMessageSound=1
; 把日志、崩溃产物与截图改写到 Logs\ 与 ScreenShot\。
RedirectClientOutputPaths=0

[CeraPurchaseGate]
; 点券商城购买门控分项开关，仅在 [Features]
; BypassCeraPurchaseRestrictions 开启时生效。
LegacySaleWindow=1
PerCharacterLimit=1
CharacterLevel=1
ClientInventoryCapacity=0
JobCompatibility=0
CurrencyBalance=0
RequiredOption=0
GiftEligibility=0
