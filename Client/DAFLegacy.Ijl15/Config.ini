; IJL15 客户端配置。
; 开关取 1/on/true 为开启，0/off/false 为关闭；缺失的键使用默认值。

[Resolution]
Width=640
Height=480

[Rendering]
; 纹理采样：point、linear、anisotropic 或 native。
ScaleFilter=native

[Features]
; 显示 FPS 与内存占用悬浮层。
EnablePerformanceOverlay=1
; 安装鼠标滚轮滚动钩子。
EnableMouseWheel=1
; 禁用客户端反调试探测。
DisableDebuggerDetection=1
; 允许同目录多开游戏窗口。
AllowMultipleClientInstances=1
; 启动时不最小化窗口。
DisableStartupMinimize=1
; 装扮期数按钮合并为一个常驻选项。
SinglePermanentAvatarPeriodOption=1
; 名单中列出的 [etc] 堆叠道具走自定义使用路径（47 号命令）。
EnableCustomStackableUseMode1=1
; 自定义弹窗公告去掉标题行。
RemoveCustomPopupAnnouncementTitle=1
; 字符串表改用 Plugin\dnf.str 外部文件。
UseExternalDnfStringTable=1
; 首封邮件到达时保持邮件归档页签刷新。
FixMailboxArchiveRefresh=1
; 全量物品列表重建（登录、整理、移动）不改写背包页签，保持当前页签。
KeepInventoryTabOnListRefresh=1
; 整理请求追加当前页签字节（主背包 装备/消耗品/材料/任务、宠物栏 宠物/宠物装备/消耗品），
; 服务端据此只整理该页签；0xFF 表示整包整理。
SendInventorySortTab=1
; 仓库窗口「升级」按钮：模块每帧把该按钮的控件矩形锚定在「整理」按钮旁（按钮由客户端自己的
; 贴图绘制），并由模块自己判定点击，命中后调用客户端自带的两个例程——打开点券商城、选中
; 当前阶段的升级工具。仓库已满（阶段 7）时不响应，界面仍显示 MAX。
UnblockStorageUpgradeButton=1
; 仅在自动锚定不可用时使用：显式指定按钮矩形 "x,y,w,h"（窗口客户区坐标），留空表示自动锚定。
StorageUpgradeButtonRect=
; 点券商城购买门控补丁总开关。
BypassCeraPurchaseRestrictions=1
; 保持 DNF.trc / NeopleEngine.LOG 日志为明文。
ForcePlainTextLogs=1
; 屏蔽 type-16 消息的提示音。
DisableType16ChatMessageSound=1
; 把日志、崩溃产物与截图改写到 Logs\ 与 ScreenShot\。
RedirectClientOutputPaths=0
; 启动时把下面 [Fonts] 指定的字体按进程私有方式注册，供引擎取用。
RegisterLocalFonts=1
; 副本秒杀：开启后模块每帧扫描当前房间的对象列表（场景类型门 3/6/7，城镇=1 不在
; 内），凡「首次见到的存活怪物」立即交给客户端自带的击杀分派器（按怪物状态走本地
; 死亡例程或 CMD 42 击杀上报）——即房间内有新怪物生成（进房刷怪、中途增援、箱子
; 出怪）就当场秒杀，掉落/经验/通关走原生流程。对象按指针跟踪连续性：已派发的存活
; 怪与尸体不再重复派发；「尸体原地复活」（多场次 Boss 换场）也交给原生战斗流程，
; 避免服务端把重复上报当新击杀结算而无限刷落。关闭时模块不做任何事。注意：开启后
; 普通房间与普通 Boss 进门即清；多场次 Boss（如选择之村-哈穆林）首次进门被消费
; 一次击杀，其余场次仍需手动打完。
EnableDungeonKillerMode=0

[Fonts]
; 相对客户端目录（或以盘符开头的绝对路径）的字体文件；缺文件时保持系统字体。
LocalFontFile=fonts/simsun.ttc
; 该文件暴露的英文族名（可用 tools/diagnostics/font_family_names.py 查看）；留空表示
; 只注册文件、不改族名（对系统已装的同族字体无效）。
LocalFontFamily=XPSimSun
; 生效范围：large=只改 18 号大字（NPC 对话弹窗等，默认）、small=只改 12 号常规 UI
; 字体（影响全界面）、both=两者都改。
LocalFontFamilyTarget=large

[CeraPurchaseGate]
; 点券商城购买门控分项开关，仅在 [Features]
; BypassCeraPurchaseRestrictions 开启时生效。
LegacySaleWindow=1
PerCharacterLimit=1
CharacterLevel=1
ClientInventoryCapacity=0
JobCompatibility=0
CurrencyBalance=0
RequiredOption=0
GiftEligibility=0
